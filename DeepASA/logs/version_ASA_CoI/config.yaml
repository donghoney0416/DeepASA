# pytorch_lightning==2.3.3
seed_everything: 3
trainer:
  accelerator: gpu
  strategy: ddp_find_unused_parameters_true
  devices: 0,1,2,3,4,5,6,7
  num_nodes: 1
  precision: bf16-mixed
  logger: null
  callbacks: null
  fast_dev_run: false
  max_epochs: 100
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 5
  gradient_clip_algorithm: norm
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  arch:
    class_path: models.arch.DeepASA.DeepASA
    init_args:
      audio_mode: ane_rev
      class_mode: cls-sed
      onoff_mode: onoff
      n_srcs: 5
      n_mics: 4
      n_cls: 13
      n_layers: 6
      att_dim: 64
      hidden_dim: 256
      n_head: 4
      emb_dim: 64
      emb_ks: 4
      emb_hs: 1
      dropout: 0.1
      eps: 1.0e-05
      use_lora: false
      freezed_modelues: []
  channels:
  - 0
  - 1
  - 2
  - 3
  ref_channel: 0
  stft:
    class_path: models.io.stft.GaborSTFT
    init_args:
      n_fft: 640
      n_hop: 320
      num_frames: 201
      win_len: 640
  norm:
    class_path: models.io.norm.Norm
    init_args:
      mode: frequency
  loss:
    class_path: models.io.loss.Loss
    init_args:
      loss_func: models.io.loss.neg_sa_sdr
      pit: true
      loss_func_kwargs: {}
  optimizer:
  - Adam
  - lr: 0.0004
    weight_decay: 1.0e-05
  lr_scheduler:
  - ReduceLROnPlateau
  - factor: 0.5
    patience: 3
    min_lr: 1.0e-06
  metrics:
  - SDR
  - SI_SDR
  val_metric: SC
  write_examples: 200
  ensemble: null
  compile: false
  exp_name: exp
model_checkpoint:
  dirpath: null
  filename: epoch{epoch}_metric{val/metric:.4f}
  monitor: val/metric
  verbose: false
  save_last: true
  save_top_k: 5
  save_weights_only: false
  mode: max
  auto_insert_metric_name: false
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: 1
  save_on_train_epoch_end: null
  enable_version_counter: true
ckpt_path: logs/DeFTAN3/version_1393/checkpoints/last.ckpt
data:
  class_path: data_loaders.AuditorySceneAnalysis.ASADataModule
  init_args:
    asa_dir: ./datasets/ASA
    sample_rate: 16000
    num_speakers: 5
    audio_time_len:
    - 4.0
    - 4.0
    - 4.0
    batch_size:
    - 2
    - 2
    n_classes: 13
    num_workers: 5
    collate_func_train: data_loaders.utils.collate_func.default_collate_func
    collate_func_val: data_loaders.utils.collate_func.default_collate_func
    collate_func_test: data_loaders.utils.collate_func.default_collate_func
    seeds:
    - null
    - 2
    - 3
    pin_memory: true
    prefetch_factor: 5
    persistent_workers: false
